<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کراچی کڈز — کھیلو اور سیکھو</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Noto Nastaliq Urdu', 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #f6d365 0%, #fda085 50%, #84fab0 100%);
    min-height: 100vh;
    direction: rtl;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
  }

  .header {
    background: linear-gradient(90deg, #ff416c, #ff4b2b);
    color: white;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    border-bottom-left-radius: 18px;
    border-bottom-right-radius: 18px;
  }
  .header h1 { font-size: 20px; font-weight: 900; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
  .menu-btn {
    background: rgba(255,255,255,0.25);
    border: none;
    color: white;
    font-size: 24px;
    padding: 4px 12px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    backdrop-filter: blur(5px);
  }

  .menu {
    position: fixed;
    top: 0; right: -100%;
    width: 85%;
    max-width: 320px;
    height: 100vh;
    background: #ffffff;
    z-index: 200;
    transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: -10px 0 30px rgba(0,0,0,0.3);
    padding: 20px 15px;
    overflow-y: auto;
  }
  .menu.khula { right: 0; }
  .menu h2 { color: #2c3e50; font-size: 22px; margin-bottom: 20px; text-align: center; font-weight: 900; }
  .menu-item {
    display: block;
    width: 100%;
    padding: 14px;
    margin-bottom: 10px;
    font-size: 16px;
    background: #f8f9fa;
    border: 2px solid #e1ebfd;
    border-radius: 15px;
    cursor: pointer;
    text-align: right;
    font-family: inherit;
    color: #2c3e50;
    font-weight: 800;
    box-shadow: 0 3px 8px rgba(0,0,0,0.02);
    transition: all 0.2s;
  }
  .menu-item.chuna { background: linear-gradient(90deg, #ff416c, #ff4b2b); color: white; border-color: #ff416c; }

  .parda {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 150;
    display: none;
    backdrop-filter: blur(2px);
  }
  .parda.dikhao { display: block; }

  .main {
    padding: 15px;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .content-area {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .hint {
    background: rgba(255, 255, 255, 0.95);
    padding: 10px;
    border-radius: 14px;
    font-size: 15px;
    color: #d63031;
    text-align: center;
    font-weight: 800;
    box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    border: 2px solid #ff7675;
  }

  .card {
    background: white;
    border-radius: 30px;
    padding: 25px 15px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    min-height: 310px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    border: 4px solid #fff;
  }

  .emoji-bara {
    font-size: 100px;
    margin-bottom: 8px;
    line-height: 1;
    filter: drop-shadow(3px 5px 6px rgba(0,0,0,0.15));
    animation: bounceIn 0.4s ease;
  }
  .harf-bara {
    font-size: 80px;
    font-weight: 900;
    margin-bottom: 4px;
    line-height: 1;
  }
  .lafz-bara {
    font-size: 36px;
    color: #2d3436;
    font-weight: 900;
    margin-bottom: 4px;
  }
  .chhota-lafz {
    font-size: 20px;
    color: #636e72;
    font-weight: 700;
  }

  @keyframes bounceIn {
    0% { transform: scale(0.3); opacity: 0; }
    50% { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); }
  }

  .controls {
    display: flex;
    gap: 10px;
  }
  .nav-btn {
    flex: 1;
    padding: 14px;
    font-size: 17px;
    border: none;
    border-radius: 15px;
    background: linear-gradient(135deg, #0984e3, #74b9ff);
    color: white;
    cursor: pointer;
    font-family: inherit;
    font-weight: 900;
    box-shadow: 0 4px 15px rgba(9,132,227,0.3);
  }
  .nav-btn:active { transform: scale(0.96); }

  .auto-btn {
    width: 100%;
    padding: 14px;
    font-size: 17px;
    border: none;
    border-radius: 15px;
    background: linear-gradient(135deg, #00b894, #55efc4);
    color: white;
    cursor: pointer;
    font-family: inherit;
    font-weight: 900;
    box-shadow: 0 4px 15px rgba(0,184,148,0.3);
  }
  .auto-btn:active { transform: scale(0.96); }
  .auto-btn.chalraha { background: linear-gradient(135deg, #d63031, #ff7675); }

  .awaz-btn {
    width: 100%;
    padding: 14px;
    font-size: 17px;
    border: none;
    border-radius: 15px;
    background: linear-gradient(135deg, #fdcb6e, #ffeaa7);
    color: #2d3436;
    cursor: pointer;
    font-family: inherit;
    font-weight: 900;
    box-shadow: 0 4px 15px rgba(253,203,110,0.3);
  }
  .awaz-btn:active { transform: scale(0.96); }

  /* گیم اسکرین */
  .game-box {
    background: white;
    border-radius: 30px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    display: none;
  }
  .game-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
  }
  .g-opt-btn {
    padding: 16px;
    font-size: 24px;
    font-weight: 900;
    border: 2px solid #dfe6e9;
    background: #f1f2f6;
    border-radius: 16px;
    cursor: pointer;
  }
  .g-opt-btn:active { transform: scale(0.95); }

  /* کسٹم پاپ اپ نوٹیفیکیشن (بغیر یو آر ایل اور نام کے) */
  .custom-popup {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.7);
    background: white;
    padding: 25px 35px;
    border-radius: 25px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    z-index: 300;
    text-align: center;
    display: none;
    transition: transform 0.3s ease;
    border: 4px solid #ff7675;
  }
  .custom-popup.show { display: block; transform: translate(-50%, -50%) scale(1); }
  .custom-popup h3 { font-size: 24px; margin-bottom: 8px; font-weight: 900; }
  .custom-popup p { font-size: 16px; color: #636e72; font-weight: 700; }

  /* ایڈ باکس (خوبصورت اور کمپیکٹ) */
  .ad-box {
    background: #fff;
    border: 2px dashed #ff7675;
    border-radius: 14px;
    padding: 12px;
    text-align: center;
    color: #d63031;
    font-size: 14px;
    font-weight: 800;
    margin-top: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.03);
  }
</style>
</head>
<body>

<div class="header">
  <h1 id="title">اردو حروف (الف سے ے)</h1>
  <button class="menu-btn" id="menuBtn">☰</button>
</div>

<div class="parda" id="parda"></div>

<!-- کسٹم پاپ اپ نوٹیفیکیشن -->
<div class="custom-popup" id="customPopup">
  <h3 id="popupTitle" style="color: #00b894;">🎉 شاباش!</h3>
  <p id="popupText">آپ کا جواب بالکل درست ہے!</p>
</div>

<!-- سلائیڈ مینو -->
<div class="menu" id="menu">
  <h2>🌟 کراچی کڈز زون 🌟</h2>
  <button class="menu-item chuna" data-mode="urdu-harf">📖 اردو حروف (الف سے انار)</button>
  <button class="menu-item" data-mode="abc">🔤 انگریزی ABC (A for Apple)</button>
  <button class="menu-item" data-mode="urdu-ginti">🔢 اردو گنتی (ایک سے سو)</button>
  <button class="menu-item" data-mode="eng-ginti">🔢 انگلش گنتی (1 to 100)</button>
  <button class="menu-item" data-mode="quiz-game" style="background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; border: none;">🎮 بچوں کا کوئز گیم</button>
</div>

<div class="main">
  <div class="content-area">
    <div class="hint" id="hint">🚀 آٹو بٹن دبائیں یا خود آگے پیچھے کریں</div>

    <!-- فلیش کارڈ اسکرین -->
    <div class="card" id="card"></div>

    <!-- گیم اسکرین -->
    <div class="game-box" id="gameBox">
      <h2 style="color: #6c5ce7; margin-bottom: 5px;">🎮 صحیح جواب بوجھو!</h2>
      <div id="qEmoji" style="font-size: 80px; margin: 10px 0;">🍎</div>
      <p id="qText" style="font-size: 18px; font-weight: 800; color: #2d3436;">یہ کس حرف سے ہے؟</p>
      <div class="game-options" id="gOptions"></div>
    </div>

    <div id="actionControls" style="display: flex; flex-direction: column; gap: 10px;">
      <button class="auto-btn" id="autoBtn">🚀 آٹو چلاؤ (Auto Play)</button>
      <button class="awaz-btn" id="awazBtn">🔊 آواز سنو (Sound)</button>

      <div class="controls">
        <button class="nav-btn" id="prevBtn">⬅️ پچھلا</button>
        <button class="nav-btn" id="nextBtn">اگلا ➡️</button>
      </div>
    </div>
  </div>

  <!-- ایڈ باکس (یہیں آپ اپنا Adsterra کوڈ بعد میں لگائیں گے) -->
  <div class="ad-box" id="adBox">
    📢 اشتہار کی جگہ (Adsterra Link)
  </div>
</div>

<script>
var rangList = ["#ff7675", "#74b9ff", "#55efc4", "#ffeaa7", "#a29bfe", "#fd79a8", "#00b894", "#0984e3", "#e17055", "#6c5ce7"];

var urduHarf = [

  { h: "غ", n: "غین", e: "🎈", w: "غبارہ" },
  { h: "ف", n: "فے", e: "⚽", w: "فٹبال" },
  { h: "ق", n: "قاف", e: "🖊️", w: "قلم" },

  { h: "ل", n: "لام", e: "🍋", w: "لسی" },
  { h: "م", n: "میم", e: "🍌", w: "موزہ" },
  { h: "ن", n: "نون", e: "⭐️", w: "نرگس" },
  { h: "و", n: "واو", e: "⏰", w: "وقت" },
  { h: "ہ", n: "ہے", e: "🚁", w: "ہاتھی" },
  { h: "ء", n: "ہمزہ", e: "🔤", w: "ہمزہ" },
  { h: "ی", n: "یے", e: "🐂", w: "یاک" },
  { h: "ے", n: "بڑی ے", e: "🤝", w: "یکجہتی" }
];

var abcList = [
  { l: "A", w: "Apple", e: "🍎" }, { l: "B", w: "Ball", e: "⚽" },
  { l: "C", w: "Cat", e: "🐱" }, { l: "D", w: "Dog", e: "🐶" },
  { l: "E", w: "Elephant", e: "🐘" }, { l: "F", w: "Fish", e: "🐟" },
  { l: "G", w: "Goat", e: "🐐" }, { l: "H", w: "Horse", e: "🐴" },
  { l: "I", w: "Ice cream", e: "🍦" }, { l: "J", w: "Jug", e: "🫙" },
  { l: "K", w: "Kite", e: "🪁" }, { l: "L", w: "Lion", e: "🦁" },
  { l: "M", w: "Moon", e: "🌙" }, { l: "N", w: "Nest", e: "🪹" },
  { l: "O", w: "Orange", e: "🍊" }, { l: "P", w: "Parrot", e: "🦜" },
  { l: "Q", w: "Queen", e: "👑" }, { l: "R", w: "Rabbit", e: "🐰" },
  { l: "S", w: "Sun", e: "☀️" }, { l: "T", w: "Tree", e: "🌳" },
  { l: "U", w: "Umbrella", e: "☂️" }, { l: "V", w: "Van", e: "🚐" },
  { l: "W", w: "Watch", e: "⌚" }, { l: "X", w: "Xylophone", e: "🎹" },
  { l: "Y", w: "Yak", e: "🐃" }, { l: "Z", w: "Zebra", e: "🦓" }
];

var urduGinti = ["ایک","دو","تین","چار","پانچ","چھ","سات","آٹھ","نو","دس","گیارہ","بارہ","تیرہ","چودہ","پندرہ","سولہ","سترہ","اٹھارہ","انیس","بیس","اکیس","بائیس","تئیس","چوبیس","پچیس","چھبیس","ستائیس","اٹھائیس","انتیس","تیس","اکتیس","بتیس","تینتیس","چونتیس","پینتیس","چھتیس","سینتیس","اڑتیس","انتالیس","چالیس","اکتالیس","بیالیس","تینتالیس","چوالیس","پینتالیس","چھیالیس","سینتالیس","اڑتالیس","انچاس","پچاس","اکاون","باون","ترپن","چون","پچپن","چھپن","ستاون","اٹھاون","انسٹھ","ساٹھ","اکسٹھ","باسٹھ","ترسٹھ","چونسٹھ","پینسٹھ","چھیاسٹھ","سڑسٹھ","اڑسٹھ","انہتر","ستر","اکہتر","بہتر","تہتر","چوہتر","پچہتر","چھہتر","ستتر","اٹھہتر","اناسی","اسی","اکیاسی","بیاسی","تراسی","چوراسی","پچاسی","چھیاسی","ستاسی","اٹھاسی","نواسی","نوے","اکانوے","بانوے","ترانوے","چورانوے","پچانوے","چھیانوے","ستانوے","اٹھانوے","ننانوے","سو"];

var engGinti = ["One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen","Twenty","Twenty One","Twenty Two","Twenty Three","Twenty Four","Twenty Five","Twenty Six","Twenty Seven","Twenty Eight","Twenty Nine","Thirty","Thirty One","Thirty Two","Thirty Three","Thirty Four","Thirty Five","Thirty Six","Thirty Seven","Thirty Eight","Thirty Nine","Forty","Forty One","Forty Two","Forty Three","Forty Four","Forty Five","Forty Six","Forty Seven","Forty Eight","Forty Nine","Fifty","Fifty One","Fifty Two","Fifty Three","Fifty Four","Fifty Five","Fifty Six","Fifty Seven","Fifty Eight","Fifty Nine","Sixty","Sixty One","Sixty Two","Sixty Three","Sixty Four","Sixty Five","Sixty Six","Sixty Seven","Sixty Eight","Sixty Nine","Seventy","Seventy One","Seventy Two","Seventy Three","Seventy Four","Seventy Five","Seventy Six","Seventy Seven","Seventy Eight","Seventy Nine","Eighty","Eighty One","Eighty Two","Eighty Three","Eighty Four","Eighty Five","Eighty Six","Eighty Seven","Eighty Eight","Eighty Nine","Ninety","Ninety One","Ninety Two","Ninety Three","Ninety Four","Ninety Five","Ninety Six","Ninety Seven","Ninety Eight","Ninety Nine","Hundred"];

var mode = "urdu-harf";
var index = 0;
var autoChalraha = false;
var autoTimer = null;

function bolo(text, lang) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'ur-PK';
  u.rate = 0.85;
  u.pitch = 1.3;
  u.volume = 1.0;
  window.speechSynthesis.speak(u);
}

function showPopup(title, text, color) {
  var popup = document.getElementById('customPopup');
  var pTitle = document.getElementById('popupTitle');
  var pText = document.getElementById('popupText');
  pTitle.innerText = title;
  pTitle.style.color = color;
  pText.innerText = text;
  popup.classList.add('show');
  setTimeout(function() {
    popup.classList.remove('show');
  }, 1500);
}

function dikhao() {
  var card = document.getElementById('card');
  var hint = document.getElementById('hint');
  var gameBox = document.getElementById('gameBox');
  var actionControls = document.getElementById('actionControls');

  if (mode === 'quiz-game') {
    card.style.display = 'none';
    actionControls.style.display = 'none';
    gameBox.style.display = 'block';
    shuruGame();
    return;
  }

  gameBox.style.display = 'none';
  card.style.display = 'flex';
  actionControls.style.display = 'flex';

  var color = rangList[index % rangList.length];

  if (mode === 'urdu-harf') {
    var item = urduHarf[index];
    card.innerHTML = '<div class="emoji-bara">' + item.e + '</div>' +
                     '<div class="harf-bara" style="color:' + color + '">' + item.h + '</div>' +
                     '<div class="lafz-bara">' + item.n + '</div>' +
                     '<div class="chhota-lafz">' + item.h + ' سے ' + item.w + '</div>';
    hint.innerText = '📖 اردو حروف: ' + (index + 1) + ' / ' + urduHarf.length;
    bolo(item.n + '۔ ' + item.h + ' سے ' + item.w, 'ur-PK');
  }
  else if (mode === 'abc') {
    var item = abcList[index];
    card.innerHTML = '<div class="emoji-bara">' + item.e + '</div>' +
                     '<div class="harf-bara" style="color:' + color + '">' + item.l + '</div>' +
                     '<div class="lafz-bara" style="color:' + color + '">' + item.l + ' for ' + item.w + '</div>';
    hint.innerText = '🔤 انگلش ABC: ' + (index + 1) + ' / ' + abcList.length;
    bolo(item.l + ' for ' + item.w, 'en-US');
  }
  else if (mode === 'urdu-ginti') {
    card.innerHTML = '<div class="emoji-bara">🔢</div>' +
                     '<div class="harf-bara" style="color:' + color + '">' + (index + 1) + '</div>' +
                     '<div class="lafz-bara" style="color:' + color + '">' + urduGinti[index] + '</div>';
    hint.innerText = '🔢 اردو گنتی: ' + (index + 1) + ' / 100';
    bolo(urduGinti[index], 'ur-PK');
  }
  else if (mode === 'eng-ginti') {
    card.innerHTML = '<div class="emoji-bara">🔢</div>' +
                     '<div class="harf-bara" style="color:' + color + '">' + (index + 1) + '</div>' +
                     '<div class="lafz-bara" style="color:' + color + '">' + engGinti[index] + '</div>';
    hint.innerText = '🔢 انگلش گنتی: ' + (index + 1) + ' / 100';
    bolo(engGinti[index], 'en-US');
  }
}

function total() {
  if (mode === 'urdu-harf') return urduHarf.length;
  if (mode === 'abc') return abcList.length;
  return 100;
}

function next() {
  index = (index + 1) % total();
  dikhao();
}

function prev() {
  index = (index - 1 + total()) % total();
  dikhao();
}

function autoBand() {
  autoChalraha = false;
  var btn = document.getElementById('autoBtn');
  btn.classList.remove('chalraha');
  btn.innerText = '🚀 آٹو چلاؤ (Auto Play)';
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
}

function autoChalao() {
  autoChalraha = true;
  var btn = document.getElementById('autoBtn');
  btn.classList.add('chalraha');
  btn.innerText = '⏸️ آٹو بند کرو';
  function step() {
    if (!autoChalraha) return;
    next();
    autoTimer = setTimeout(step, 4000);
  }
  autoTimer = setTimeout(step, 4000);
}

document.getElementById('autoBtn').onclick = function() {
  if (autoChalraha) autoBand();
  else autoChalao();
};

document.getElementById('awazBtn').onclick = function() { dikhao(); };
document.getElementById('nextBtn').onclick = next;
document.getElementById('prevBtn').onclick = prev;

var menu = document.getElementById('menu');
var parda = document.getElementById('parda');
document.getElementById('menuBtn').onclick = function() {
  menu.classList.add('khula'); parda.classList.add('dikhao');
};
parda.onclick = function() {
  menu.classList.remove('khula'); parda.classList.remove('dikhao');
};

var menuItems = document.querySelectorAll('.menu-item');
menuItems.forEach(function(btn) {
  btn.onclick = function() {
    menuItems.forEach(function(b) { b.classList.remove('chuna'); });
    this.classList.add('chuna');
    mode = this.getAttribute('data-mode');
    index = 0;
    autoBand();

    var titles = {
      'urdu-harf': 'اردو حروف (الف سے ے)',
      'abc': 'انگریزی ABC',
      'urdu-ginti': 'اردو گنتی (ایک سے سو)',
      'eng-ginti': 'انگلش گنتی (1 to 100)',
      'quiz-game': 'بچوں کا کوئز گیم'
    };
    document.getElementById('title').innerText = titles[mode];

    menu.classList.remove('khula'); parda.classList.remove('dikhao');
    dikhao();
  };
});

function shuruGame() {
  var randItem = urduHarf[Math.floor(Math.random() * urduHarf.length)];
  document.getElementById('qEmoji').innerText = randItem.e;
  document.getElementById('qText').innerText = randItem.w + ' کس حرف سے بنتا ہے؟';
  bolo(randItem.w + ' کس حرف سے بنتا ہے؟', 'ur-PK');

  var options = [randItem.h];
  while(options.length < 4) {
    var r = urduHarf[Math.floor(Math.random() * urduHarf.length)].h;
    if(!options.includes(r)) options.push(r);
  }
  options.sort(function() { return 0.5 - Math.random(); });

  var gOptDiv = document.getElementById('gOptions');
  gOptDiv.innerHTML = '';
  options.forEach(function(opt) {
    var b = document.createElement('button');
    b.className = 'g-opt-btn';
    b.innerText = opt;
    b.onclick = function() {
      if(opt === randItem.h) {
        bolo('بہت اچھے! بالکل درست جواب', 'ur-PK');
        showPopup("🎉 شاباش!", "آپ کا جواب بالکل صحیح ہے!", "#00b894");
        setTimeout(shuruGame, 1600);
      } else {
        bolo('دوبارہ کوشش کریں', 'ur-PK');
        showPopup("❌ غلط!", "دوبارہ کوشش کریں!", "#d63031");
      }
    };
    gOptDiv.appendChild(b);
  });
}

dikhao();
</script>

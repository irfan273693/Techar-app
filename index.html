<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کھیلو اور سیکھو</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Noto Nastaliq Urdu', 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #e8f4ff 0%, #fef6e4 100%);
    min-height: 100vh;
    direction: rtl;
    overflow-x: hidden;
  }

  /* ہیڈر */
  .header {
    background: #4a90e2;
    color: white;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
  }
  .header h1 { font-size: 19px; font-weight: 700; }
  .menu-btn {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    font-size: 26px;
    padding: 4px 12px;
    border-radius: 8px;
    cursor: pointer;
    line-height: 1;
  }

  /* مینو */
  .menu {
    position: fixed;
    top: 0; right: -100%;
    width: 82%;
    max-width: 320px;
    height: 100vh;
    background: white;
    z-index: 200;
    transition: right 0.3s ease;
    box-shadow: -4px 0 20px rgba(0,0,0,0.2);
    padding: 20px;
    overflow-y: auto;
  }
  .menu.khula { right: 0; }
  .menu h2 { color: #2c3e50; font-size: 20px; margin-bottom: 18px; text-align: center; }
  .menu-item {
    display: block;
    width: 100%;
    padding: 16px;
    margin-bottom: 12px;
    font-size: 17px;
    background: #f0f7ff;
    border: 2px solid #d0e2f7;
    border-radius: 14px;
    cursor: pointer;
    text-align: right;
    font-family: inherit;
    color: #1a1a2e;
    font-weight: 600;
  }
  .menu-item:active { background: #d0e2f7; }
  .menu-item.chuna { background: #4a90e2; color: white; border-color: #4a90e2; }

  /* پردہ */
  .parda {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 150;
    display: none;
  }
  .parda.dikhao { display: block; }

  /* مرکزی حصہ */
  .main {
    padding: 20px 16px 100px;
    max-width: 500px;
    margin: 0 auto;
  }

  /* کارڈ */
  .card {
    background: white;
    border-radius: 24px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(74,144,226,0.15);
    margin-bottom: 20px;
    min-height: 340px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .emoji {
    font-size: 90px;
    margin-bottom: 15px;
    line-height: 1;
  }
  .bara-harf {
    font-size: 80px;
    font-weight: 800;
    color: #4a90e2;
    margin-bottom: 10px;
    line-height: 1.1;
  }
  .lafz {
    font-size: 30px;
    color: #2c3e50;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .chhota-lafz {
    font-size: 18px;
    color: #7f8c8d;
  }

  /* بٹن */
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .nav-btn {
    flex: 1;
    padding: 16px;
    font-size: 17px;
    border: none;
    border-radius: 14px;
    background: #4a90e2;
    color: white;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
  }
  .nav-btn:active { background: #357abd; }
  .nav-btn:disabled { background: #c5d5e8; }

  .awaz-btn {
    width: 100%;
    padding: 18px;
    font-size: 19px;
    border: none;
    border-radius: 14px;
    background: #f39c12;
    color: white;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    margin-bottom: 20px;
  }
  .awaz-btn:active { background: #d68910; }

  .ginti-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 15px;
  }
  .ginti-cell {
    background: #f0f7ff;
    border: 2px solid #d0e2f7;
    border-radius: 10px;
    padding: 12px 4px;
    font-size: 18px;
    font-weight: 700;
    color: #2c3e50;
    cursor: pointer;
    text-align: center;
    font-family: inherit;
  }
  .ginti-cell:active { background: #4a90e2; color: white; }
  .ginti-cell.chuna { background: #4a90e2; color: white; border-color: #4a90e2; }

  .ad-box {
    background: #fff8e1;
    border: 2px dashed #f39c12;
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    color: #b9770e;
    font-size: 14px;
    margin-top: 10px;
  }

  .hint {
    background: #e8f4ff;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    color: #2c3e50;
    margin-bottom: 15px;
    text-align: center;
  }

  @media (max-width: 360px) {
    .bara-harf { font-size: 60px; }
    .emoji { font-size: 70px; }
    .lafz { font-size: 24px; }
    .ginti-cell { font-size: 15px; padding: 10px 2px; }
  }
</style>
</head>
<body>

<!-- ہیڈر -->
<div class="header">
  <h1 id="title">اردو حروف</h1>
  <button class="menu-btn" id="menuBtn">☰</button>
</div>

<!-- پردہ -->
<div class="parda" id="parda"></div>

<!-- مینو -->
<div class="menu" id="menu">
  <h2>کھیلو اور سیکھو</h2>
  <button class="menu-item chuna" data-mode="urdu-harf">اردو حروف — الف سے ے</button>
  <button class="menu-item" data-mode="urdu-ginti">اردو گنتی — ایک، دو، تین</button>
  <button class="menu-item" data-mode="eng-ginti">انگریزی گنتی — 1، 2، 3</button>
  <button class="menu-item" data-mode="abc">انگریزی ABC — A to Z</button>
  <button class="menu-item" data-mode="urdu-lafz">اردو الفاظ — الف سے انار</button>
</div>

<!-- مرکزی حصہ -->
<div class="main">
  <div class="hint" id="hint">بٹن دبا کر آواز سنو</div>
  <div class="card" id="card"></div>

  <!-- گنتی گرڈ -->
  <div class="ginti-grid" id="gintiGrid" style="display:none;"></div>

  <!-- آواز بٹن -->
  <button class="awaz-btn" id="awazBtn">🔊 آواز سنو</button>

  <!-- اگلا پچھلا -->
  <div class="controls">
    <button class="nav-btn" id="prevBtn">پچھلا</button>
    <button class="nav-btn" id="nextBtn">اگلا</button>
  </div>

  <!-- Adsterra کی جگہ -->
  <div class="ad-box" id="adBox">
    یہاں Adsterra کا اشتہار لگے گا
  </div>
</div>

<script>
// ===================== ڈیٹا =====================

// اردو حروف
var urduHarf = [

  { h: "پ", n: "پے", e: "🐦", w: "پرندہ" },
  { h: "ت", n: "تے", e: "🍎", w: "توت" },
  { h: "ٹ", n: "ٹے", e: "🎩", w: "ٹوپی" },
  { h: "ث", n: "ثے", e: "🍇", w: "ثمر" },
  { h: "ج", n: "جیم", e: "🌳", w: "جنگل" },
  { h: "چ", n: "چے", e: "🫖", w: "چائے" },
  { h: "ح", n: "حے", e: "🐳", w: "حوت" },
  { h: "خ", n: "خے", e: "🐻", w: "خرگوش" },
  { h: "د", n: "دال", e: "🌱", w: "درخت" },
  { h: "ڈ", n: "ڈال", e: "🥁", w: "ڈھول" },
  { h: "ذ", n: "ذال", e: "🦌", w: "ذبح" },
  { h: "ر", n: "رے", e: "🛣️", w: "راستہ" },
  { h: "ڑ", n: "ڑے", e: "🥖", w: "روٹی" },
  { h: "ز", n: "زے", e: "🦓", w: "زیبرا" },
  { h: "ژ", n: "ژے", e: "🗡️", w: "ژالہ" },
  { h: "س", n: "سین", e: "🍏", w: "سیب" },
  { h: "ش", n: "شین", e: "☀️", w: "شمس" },
  { h: "ص", n: "صاد", e: "📦", w: "صندوق" },
  { h: "ض", n: "ضاد", e: "🤲", w: "ضرب" },
  { h: "ط", n: "طوے", e: "🦚", w: "طوطا" },
  { h: "ظ", n: "ظوے", e: "🕛", w: "ظہر" },
  { h: "ع", n: "عین", e: "👁️", w: "عین" },
  { h: "غ", n: "غین", e: "☁️", w: "غبار" },
  { h: "ف", n: "فے", e: "🐘", w: "فیل" },
  { h: "ق", n: "قاف", e: "🖊️", w: "قلم" },
  { h: "ک", n: "کاف", e: "📖", w: "کتاب" },
  { h: "گ", n: "گاف", e: "🌹", w: "گلاب" },
  { h: "ل", n: "لام", e: "🪵", w: "لکڑی" },
  { h: "م", n: "میم", e: "🐟", w: "مچھلی" },
  { h: "ن", n: "نون", e: "🌊", w: "نہر" },
  { h: "و", n: "واو", e: "🌪️", w: "وادی" },
  { h: "ہ", n: "ہے", e: "🐘", w: "ہاتھی" },
  { h: "ء", n: "ہمزہ", e: "💧", w: "پانی" },
  { h: "ی", n: "یے", e: "👐", w: "ید" },
  { h: "ے", n: "ے", e: "🛏️", w: "بستر" }
];

// اردو گنتی 1-100
var urduGinti = [
  "ایک","دو","تین","چار","پانچ","چھ","سات","آٹھ","نو","دس",
  "گیارہ","بارہ","تیرہ","چودہ","پندرہ","سولہ","سترہ","اٹھارہ","انیس","بیس",
  "اکیس","بائیس","تئیس","چوبیس","پچیس","چھبیس","ستائیس","اٹھائیس","انتیس","تیس",
  "اکتیس","بتیس","تینتیس","چونتیس","پینتیس","چھتیس","سینتیس","اڑتیس","انتالیس","چالیس",
  "اکتالیس","بیالیس","تینتالیس","چوالیس","پینتالیس","چھیالیس","سینتالیس","اڑتالیس","انچاس","پچاس",
  "اکاون","باون","ترپن","چون","پچپن","چھپن","ستاون","اٹھاون","انسٹھ","ساٹھ",
  "اکسٹھ","باسٹھ","ترسٹھ","چونسٹھ","پینسٹھ","چھیاسٹھ","سڑسٹھ","اڑسٹھ","انہتر","ستر",
  "اکہتر","بہتر","تہتر","چوہتر","پچہتر","چھہتر","ستتر","اٹھہتر","اناسی","اسی",
  "اکیاسی","بیاسی","تراسی","چوراسی","پچاسی","چھیاسی","ستاسی","اٹھاسی","نواسی","نوے",
  "اکانوے","بانوے","ترانوے","چورانوے","پچانوے","چھیانوے","ستانوے","اٹھانوے","ننانوے","سو"
];

// انگریزی ABC
var abcList = [
  { l: "A", w: "Apple", e: "🍎" },
  { l: "B", w: "Ball", e: "⚽" },
  { l: "C", w: "Cat", e: "🐱" },
  { l: "D", w: "Dog", e: "🐶" },
  { l: "E", w: "Elephant", e: "🐘" },
  { l: "F", w: "Fish", e: "🐟" },
  { l: "G", w: "Goat", e: "🐐" },
  { l: "H", w: "Horse", e: "🐴" },
  { l: "I", w: "Ice", e: "🧊" },
  { l: "J", w: "Jug", e: "🫙" },
  { l: "K", w: "Kite", e: "🪁" },
  { l: "L", w: "Lion", e: "🦁" },
  { l: "M", w: "Moon", e: "🌙" },
  { l: "N", w: "Nest", e: "🪹" },
  { l: "O", w: "Orange", e: "🍊" },
  { l: "P", w: "Parrot", e: "🦜" },
  { l: "Q", w: "Queen", e: "👑" },
  { l: "R", w: "Rabbit", e: "🐰" },
  { l: "S", w: "Sun", e: "☀️" },
  { l: "T", w: "Tree", e: "🌳" },
  { l: "U", w: "Umbrella", e: "☂️" },
  { l: "V", w: "Van", e: "🚐" },
  { l: "W", w: "Watch", e: "⌚" },
  { l: "X", w: "Xylophone", e: "🎹" },
  { l: "Y", w: "Yak", e: "🐃" },
  { l: "Z", w: "Zebra", e: "🦓" }
];

// انگریزی گنتی 1-100 الفاظ
var engGinti = [
  "One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten",
  "Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen","Twenty",
  "Twenty One","Twenty Two","Twenty Three","Twenty Four","Twenty Five","Twenty Six","Twenty Seven","Twenty Eight","Twenty Nine","Thirty",
  "Thirty One","Thirty Two","Thirty Three","Thirty Four","Thirty Five","Thirty Six","Thirty Seven","Thirty Eight","Thirty Nine","Forty",
  "Forty One","Forty Two","Forty Three","Forty Four","Forty Five","Forty Six","Forty Seven","Forty Eight","Forty Nine","Fifty",
  "Fifty One","Fifty Two","Fifty Three","Fifty Four","Fifty Five","Fifty Six","Fifty Seven","Fifty Eight","Fifty Nine","Sixty",
  "Sixty One","Sixty Two","Sixty Three","Sixty Four","Sixty Five","Sixty Six","Sixty Seven","Sixty Eight","Sixty Nine","Seventy",
  "Seventy One","Seventy Two","Seventy Three","Seventy Four","Seventy Five","Seventy Six","Seventy Seven","Seventy Eight","Seventy Nine","Eighty",
  "Eighty One","Eighty Two","Eighty Three","Eighty Four","Eighty Five","Eighty Six","Eighty Seven","Eighty Eight","Eighty Nine","Ninety",
  "Ninety One","Ninety Two","Ninety Three","Ninety Four","Ninety Five","Ninety Six","Ninety Seven","Ninety Eight","Ninety Nine","Hundred"
];

// ===================== حالت =====================
var mode = "urdu-harf";
var index = 0;
var gintiStart = 0;

// ===================== آواز =====================
function bolo(text, lang) {
  if (!('speechSynthesis' in window)) {
    alert("آپ کے فون میں آواز کی سہولت نہیں ہے");
    return;
  }
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'ur-PK';
  u.rate = 0.75;
  u.pitch = 1.3;
  u.volume = 1.0;

  // لڑکی کی آواز ڈھونڈو
  var voices = window.speechSynthesis.getVoices();
  for (var i = 0; i < voices.length; i++) {
    var v = voices[i];
    if ((v.lang === 'ur-PK' || v.lang === 'hi-IN' || v.lang.indexOf('ur') === 0 || v.lang.indexOf('hi') === 0)) {
      if (v.name.toLowerCase().indexOf('female') !== -1 ||
          v.name.toLowerCase().indexOf('woman') !== -1 ||
          v.name.toLowerCase().indexOf('zira') !== -1 ||
          v.name.toLowerCase().indexOf('heera') !== -1 ||
          v.name.toLowerCase().indexOf('swara') !== -1) {
        u.voice = v;
        break;
      }
    }
  }
  window.speechSynthesis.speak(u);
}

// آوازیں لوڈ کرو
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = function() {};
  window.speechSynthesis.getVoices();
}

// ===================== کارڈ دکھاؤ =====================
function dikhao() {
  var card = document.getElementById('card');
  var hint = document.getElementById('hint');
  var grid = document.getElementById('gintiGrid');
  grid.style.display = 'none';
  grid.innerHTML = '';
  card.style.display = 'flex';

  if (mode === 'urdu-harf') {
    var item = urduHarf[index];
    card.innerHTML = '<div class="emoji">' + item.e + '</div>' +
                     '<div class="bara-harf">' + item.h + '</div>' +
                     '<div class="lafz">' + item.n + '</div>' +
                     '<div class="chhota-lafz">' + item.w + '</div>';
    hint.innerText = 'حرف نمبر ' + (index + 1) + ' — کل ' + urduHarf.length;
    bolo(item.n + '۔ ' + item.w, 'ur-PK');
  }

  else if (mode === 'abc') {
    var item = abcList[index];
    card.innerHTML = '<div class="emoji">' + item.e + '</div>' +
                     '<div class="bara-harf">' + item.l + '</div>' +
                     '<div class="lafz">' + item.w + '</div>';
    hint.innerText = 'Letter ' + (index + 1) + ' — Total ' + abcList.length;
    bolo(item.l + '. ' + item.w, 'en-US');
  }

  else if (mode === 'urdu-ginti' || mode === 'eng-ginti') {
    card.style.display = 'none';
    grid.style.display = 'grid';
    hint.innerText = (mode === 'urdu-ginti' ? 'اردو گنتی' : 'انگریزی گنتی') +
                     ' — ' + (gintiStart + 1) + ' سے ' + (gintiStart + 10) + ' تک';
    for (var i = 0; i < 10; i++) {
      var num = gintiStart + i + 1;
      var cell = document.createElement('button');
      cell.className = 'ginti-cell';
      if (mode === 'urdu-ginti') {
        cell.innerText = urduGinti[num - 1];
      } else {
        cell.innerText = num;
      }
      cell.setAttribute('data-num', num);
      cell.onclick = (function(n) {
        return function() {
          var cells = document.querySelectorAll('.ginti-cell');
          cells.forEach(function(c) { c.classList.remove('chuna'); });
          this.classList.add('chuna');
          if (mode === 'urdu-ginti') {
            bolo(urduGinti[n - 1], 'ur-PK');
          } else {
            bolo(engGinti[n - 1], 'en-US');
          }
        };
      })(num);
      grid.appendChild(cell);
    }
    // پہلا نمبر خود بولے
    var pehla = gintiStart + 1;
    if (mode === 'urdu-ginti') {
      bolo(urduGinti[pehla - 1], 'ur-PK');
    } else {
      bolo(engGinti[pehla - 1], 'en-US');
    }
  }

  else if (mode === 'urdu-lafz') {
    var item = urduHarf[index];
    card.innerHTML = '<div class="emoji">' + item.e + '</div>' +
                     '<div class="bara-harf">' + item.h + '</div>' +
                     '<div class="lafz">' + item.w + '</div>';
    hint.innerText = 'لفظ نمبر ' + (index + 1) + ' — کل ' + urduHarf.length;
    bolo(item.w, 'ur-PK');
  }
}

// ===================== اگلا پچھلا =====================
function next() {
  if (mode === 'urdu-harf' || mode === 'abc' || mode === 'urdu-lafz') {
    var total = (mode === 'abc') ? abcList.length : urduHarf.length;
    index = (index + 1) % total;
  } else {
    gintiStart = (gintiStart + 10) % 100;
  }
  dikhao();
}

function prev() {
  if (mode === 'urdu-harf' || mode === 'abc' || mode === 'urdu-lafz') {
    var total = (mode === 'abc') ? abcList.length : urduHarf.length;
    index = (index - 1 + total) % total;
  } else {
    gintiStart = (gintiStart - 10 + 100) % 100;
  }
  dikhao();
}

// ===================== مینو =====================
var menu = document.getElementById('menu');
var parda = document.getElementById('parda');
var menuBtn = document.getElementById('menuBtn');
var title = document.getElementById('title');

menuBtn.onclick = function() {
  menu.classList.add('khula');
  parda.classList.add('dikhao');
};
parda.onclick = function() {
  menu.classList.remove('khula');
  parda.classList.remove('dikhao');
};

var menuItems = document.querySelectorAll('.menu-item');
menuItems.forEach(function(btn) {
  btn.onclick = function() {
    menuItems.forEach(function(b) { b.classList.remove('chuna'); });
    this.classList.add('chuna');
    mode = this.getAttribute('data-mode');
    index = 0;
    gintiStart = 0;

    if (mode === 'urdu-harf') title.innerText = 'اردو حروف';
    else if (mode === 'urdu-ginti') title.innerText = 'اردو گنتی';
    else if (mode === 'eng-ginti') title.innerText = 'انگریزی گنتی';
    else if (mode === 'abc') title.innerText = 'انگریزی ABC';
    else if (mode === 'urdu-lafz') title.innerText = 'اردو الفاظ';

    menu.classList.remove('khula');
    parda.classList.remove('dikhao');
    dikhao();
  };
});

// ===================== آواز بٹن =====================
document.getElementById('awazBtn').onclick = function() {
  dikhao();
};

// ===================== اگلا پچھلا بٹن =====================
document.getElementById('nextBtn').onclick = next;
document.getElementById('prevBtn').onclick = prev;

// ===================== کی بورڈ =====================
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft') next();
  if (e.key === 'ArrowRight') prev();
});

// ===================== شروع =====================
dikhao();
</script>

<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کھیلو اور سیکھو</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Noto Nastaliq Urdu', 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(160deg, #ffeaa7 0%, #a8e6cf 50%, #dcedc1 100%);
    min-height: 100vh;
    direction: rtl;
    overflow-x: hidden;
  }

  .header {
    background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #1dd1a1);
    color: white;
    padding: 15px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }
  .header h1 { font-size: 20px; font-weight: 800; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
  .menu-btn {
    background: rgba(255,255,255,0.3);
    border: none;
    color: white;
    font-size: 28px;
    padding: 6px 14px;
    border-radius: 12px;
    cursor: pointer;
    line-height: 1;
    font-weight: bold;
  }

  .menu {
    position: fixed;
    top: 0; right: -100%;
    width: 85%;
    max-width: 340px;
    height: 100vh;
    background: linear-gradient(180deg, #ffffff 0%, #f0f7ff 100%);
    z-index: 200;
    transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: -5px 0 25px rgba(0,0,0,0.25);
    padding: 22px;
    overflow-y: auto;
  }
  .menu.khula { right: 0; }
  .menu h2 { color: #2c3e50; font-size: 22px; margin-bottom: 20px; text-align: center; font-weight: 800; }
  .menu-item {
    display: block;
    width: 100%;
    padding: 18px;
    margin-bottom: 12px;
    font-size: 18px;
    background: white;
    border: 3px solid #d0e2f7;
    border-radius: 16px;
    cursor: pointer;
    text-align: right;
    font-family: inherit;
    color: #1a1a2e;
    font-weight: 700;
    transition: all 0.2s;
  }
  .menu-item:active { transform: scale(0.97); background: #e8f4ff; }
  .menu-item.chuna { background: linear-gradient(90deg, #4a90e2, #6bb6ff); color: white; border-color: #4a90e2; }

  .parda {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 150;
    display: none;
  }
  .parda.dikhao { display: block; }

  .main {
    padding: 20px 16px 120px;
    max-width: 520px;
    margin: 0 auto;
  }

  .card {
    background: white;
    border-radius: 30px;
    padding: 35px 20px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(74,144,226,0.25);
    margin-bottom: 20px;
    min-height: 400px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  .emoji-bara {
    font-size: 110px;
    margin-bottom: 15px;
    line-height: 1;
    filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.15));
  }
  .harf-bara {
    font-size: 100px;
    font-weight: 900;
    margin-bottom: 10px;
    line-height: 1.1;
    text-shadow: 3px 3px 0px rgba(0,0,0,0.1);
  }
  .lafz-bara {
    font-size: 42px;
    color: #2c3e50;
    font-weight: 900;
    margin-bottom: 8px;
    text-shadow: 2px 2px 0px #ffeaa7;
  }
  .chhota-lafz {
    font-size: 20px;
    color: #7f8c8d;
    font-weight: 600;
  }

  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 18px;
  }
  .nav-btn {
    flex: 1;
    padding: 18px;
    font-size: 18px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #4a90e2, #357abd);
    color: white;
    cursor: pointer;
    font-family: inherit;
    font-weight: 800;
    box-shadow: 0 4px 12px rgba(74,144,226,0.3);
    transition: all 0.2s;
  }
  .nav-btn:active { transform: scale(0.96); background: #357abd; }

  .auto-btn {
    width: 100%;
    padding: 20px;
    font-size: 20px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #1dd1a1, #10ac84);
    color: white;
    cursor: pointer;
    font-family: inherit;
    font-weight: 900;
    margin-bottom: 18px;
    box-shadow: 0 5px 15px rgba(29,209,161,0.4);
    transition: all 0.2s;
  }
  .auto-btn:active { transform: scale(0.96); }
  .auto-btn.chalraha { background: linear-gradient(135deg, #ee5a24, #f0932b); }

  .awaz-btn {
    width: 100%;
    padding: 20px;
    font-size: 20px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #feca57, #ff9f43);
    color: white;
    cursor: pointer;
    font-family: inherit;
    font-weight: 900;
    margin-bottom: 18px;
    box-shadow: 0 5px 15px rgba(254,202,87,0.4);
    transition: all 0.2s;
  }
  .awaz-btn:active { transform: scale(0.96); }

  .ad-box {
    background: #fff8e1;
    border: 3px dashed #f39c12;
    border-radius: 16px;
    padding: 22px;
    text-align: center;
    color: #b9770e;
    font-size: 15px;
    margin-top: 15px;
    font-weight: 600;
  }

  .hint {
    background: linear-gradient(90deg, #e8f4ff, #f0f7ff);
    padding: 14px;
    border-radius: 14px;
    font-size: 15px;
    color: #2c3e50;
    margin-bottom: 15px;
    text-align: center;
    font-weight: 700;
    border: 2px solid #d0e2f7;
  }

  @media (max-width: 380px) {
    .harf-bara { font-size: 75px; }
    .emoji-bara { font-size: 85px; }
    .lafz-bara { font-size: 32px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1 id="title">اردو حروف</h1>
  <button class="menu-btn" id="menuBtn">☰</button>
</div>

<div class="parda" id="parda"></div>

<div class="menu" id="menu">
  <h2>🌈 کھیلو اور سیکھو</h2>
  <button class="menu-item chuna" data-mode="urdu-harf">🔤 اردو حروف — الف سے ے</button>
  <button class="menu-item" data-mode="urdu-lafz">📖 اردو الفاظ — الف سے انار</button>
  <button class="menu-item" data-mode="abc">🅰️ انگریزی ABC — A to Z</button>
  <button class="menu-item" data-mode="urdu-ginti">🔢 اردو گنتی — ایک سے سو</button>
  <button class="menu-item" data-mode="eng-ginti">🔢 انگریزی گنتی — 1 سے 100</button>
</div>

<div class="main">
  <div class="hint" id="hint">🚀 Auto بٹن دبا کر خود چلاؤ</div>
  <div class="card" id="card"></div>

  <button class="auto-btn" id="autoBtn">🚀 Auto چلاؤ</button>
  <button class="awaz-btn" id="awazBtn">🔊 آواز سنو</button>

  <div class="controls">
    <button class="nav-btn" id="prevBtn">⬅️ پچھلا</button>
    <button class="nav-btn" id="nextBtn">اگلا ➡️</button>
  </div>

  <!-- Adsterra یہاں لگاؤ -->
  <div class="ad-box" id="adBox">
    📢 یہاں Adsterra کا اشتہار لگے گا
  </div>
</div>

<script>

  { h: "ع", n: "عین", e: "🍇", w: "عنب" },
  { h: "غ", n: "غین", e: "🎈", w: "غبارہ" },
  { h: "ف", n: "فے", e: "🕊️", w: "فاختہ" },
  { h: "ق", n: "قاف", e: "🖊️", w: "قلم" },
  { h: "ک", n: "کاف", e: "📖", w: "کتاب" },
  { h: "گ", n: "گاف", e: "🐄", w: "گائے" },
  { h: "ل", n: "لام", e: "🟡", w: "لڈو" },
  { h: "م", n: "میم", e: "🪰", w: "مکھی" },
  { h: "ن", n: "نون", e: "🌼", w: "نرگس" },
  { h: "و", n: "واو", e: "⏰", w: "وقت" },

var urduGinti = [

  "گیارہ","بارہ","تیرہ","چودہ","پندرہ","سولہ","سترہ","اٹھارہ","انیس","بیس",
  "اکیس","بائیس","تئیس","چوبیس","پچیس","چھبیس","ستائیس","اٹھائیس","انتیس","تیس",
  "اکتیس","بتیس","تینتیس","چونتیس","پینتیس","چھتیس","سینتیس","اڑتیس","انتالیس","چالیس",
  "اکتالیس","بیالیس","تینتالیس","چوالیس","پینتالیس","چھیالیس","سینتالیس","اڑتالیس","انچاس","پچاس",
  "اکاون","باون","ترپن","چون","پچپن","چھپن","ستاون","اٹھاون","انسٹھ","ساٹھ",
  "اکسٹھ","باسٹھ","ترسٹھ","چونسٹھ","پینسٹھ","چھیاسٹھ","سڑسٹھ","اڑسٹھ","انہتر","ستر",
  "اکہتر","بہتر","تہتر","چوہتر","پچہتر","چھہتر","ستتر","اٹھہتر","اناسی","اسی",
  "اکیاسی","بیاسی","تراسی","چوراسی","پچاسی","چھیاسی","ستاسی","اٹھاسی","نواسی","نوے",
  "اکانوے","بانوے","ترانوے","چورانوے","پچانوے","چھیانوے","ستانوے","اٹھانوے","ننانوے","سو"
];

var abcList = [
  { l: "A", w: "Apple", e: "🍎" }, { l: "B", w: "Ball", e: "⚽" },
  { l: "C", w: "Cat", e: "🐱" }, { l: "D", w: "Dog", e: "🐶" },
  { l: "E", w: "Elephant", e: "🐘" }, { l: "F", w: "Fish", e: "🐟" },
  { l: "G", w: "Goat", e: "🐐" }, { l: "H", w: "Horse", e: "🐴" },
  { l: "I", w: "Ice", e: "🧊" }, { l: "J", w: "Jug", e: "🫙" },
  { l: "K", w: "Kite", e: "🪁" }, { l: "L", w: "Lion", e: "🦁" },
  { l: "M", w: "Moon", e: "🌙" }, { l: "N", w: "Nest", e: "🪹" },
  { l: "O", w: "Orange", e: "🍊" }, { l: "P", w: "Parrot", e: "🦜" },

  { l: "W", w: "Watch", e: "⌚" }, { l: "X", w: "Xylophone", e: "🎹" },
  { l: "Y", w: "Yak", e: "🐃" }, { l: "Z", w: "Zebra", e: "🦓" }
];

var engGinti = [
  "One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten",
  "Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen","Twenty",
  "Twenty One","Twenty Two","Twenty Three","Twenty Four","Twenty Five","Twenty Six","Twenty Seven","Twenty Eight","Twenty Nine","Thirty",
  "Thirty One","Thirty Two","Thirty Three","Thirty Four","Thirty Five","Thirty Six","Thirty Seven","Thirty Eight","Thirty Nine","Forty",
  "Forty One","Forty Two","Forty Three","Forty Four","Forty Five","Forty Six","Forty Seven","Forty Eight","Forty Nine","Fifty",
  "Fifty One","Fifty Two","Fifty Three","Fifty Four","Fifty Five","Fifty Six","Fifty Seven","Fifty Eight","Fifty Nine","Sixty",
  "Sixty One","Sixty Two","Sixty Three","Sixty Four","Sixty Five","Sixty Six","Sixty Seven","Sixty Eight","Sixty Nine","Seventy",
  "Seventy One","Seventy Two","Seventy Three","Seventy Four","Seventy Five","Seventy Six","Seventy Seven","Seventy Eight","Seventy Nine","Eighty",
  "Eighty One","Eighty Two","Eighty Three","Eighty Four","Eighty Five","Eighty Six","Eighty Seven","Eighty Eight","Eighty Nine","Ninety",
  "Ninety One","Ninety Two","Ninety Three","Ninety Four","Ninety Five","Ninety Six","Ninety Seven","Ninety Eight","Ninety Nine","Hundred"
];

// ===================== حالت =====================
var mode = "urdu-harf";
var index = 0;
var autoChalraha = false;
var autoTimer = null;

// ===================== ہلکی ٹن (بِپ) =====================
function bip() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.15);
  } catch(e) {}
}

// ===================== آواز =====================
function bolo(text, lang) {
  bip();
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'ur-PK';
  u.rate = 0.8;
  u.pitch = 1.5;
  u.volume = 1.0;

  var voices = window.speechSynthesis.getVoices();
  for (var i = 0; i < voices.length; i++) {
    var v = voices[i];
    var nm = v.name.toLowerCase();
    if (v.lang.indexOf('ur') === 0 || v.lang.indexOf('hi') === 0) {
      if (nm.indexOf('female') !== -1 || nm.indexOf('woman') !== -1 ||
          nm.indexOf('zira') !== -1 || nm.indexOf('heera') !== -1 ||
          nm.indexOf('swara') !== -1 || nm.indexOf('kalpana') !== -1) {
        u.voice = v;
        break;
      }
    }
  }
  window.speechSynthesis.speak(u);
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = function() {};
}

// ===================== دکھاؤ =====================
function dikhao() {
  var card = document.getElementById('card');
  var hint = document.getElementById('hint');
  card.style.display = 'flex';

  var color = rang[index % rang.length];

  if (mode === 'urdu-harf') {
    var item = urduHarf[index];
    card.innerHTML = '<div class="emoji-bara">' + item.e + '</div>' +
                     '<div class="harf-bara" style="color:' + color + '">' + item.h + '</div>' +
                     '<div class="lafz-bara">' + item.n + '</div>' +
                     '<div class="chhota-lafz">' + item.w + '</div>';
    hint.innerText = '📖 ' + (index + 1) + ' / ' + urduHarf.length;
    bolo(item.n + '۔ ' + item.w, 'ur-PK');
  }

  else if (mode === 'urdu-lafz') {
    var item = urduHarf[index];
    card.innerHTML = '<div class="emoji-bara">' + item.e + '</div>' +
                     '<div class="harf-bara" style="color:' + color + '">' + item.h + '</div>' +
                     '<div class="lafz-bara" style="color:' + color + '">' + item.w + '</div>';
    hint.innerText = '📖 ' + (index + 1) + ' / ' + urduHarf.length;
    bolo(item.w, 'ur-PK');
  }

  else if (mode === 'abc') {
    var item = abcList[index];
    card.innerHTML = '<div class="emoji-bara">' + item.e + '</div>' +
                     '<div class="harf-bara" style="color:' + color + '">' + item.l + '</div>' +
                     '<div class="lafz-bara">' + item.l + ' for ' + item.w + '</div>';
    hint.innerText = '🅰️ ' + (index + 1) + ' / ' + abcList.length;
    bolo(item.l + ' for ' + item.w, 'en-US');
  }

  else if (mode === 'urdu-ginti') {
    card.innerHTML = '<div class="harf-bara" style="color:' + color + '">' + (index + 1) + '</div>' +
                     '<div class="lafz-bara" style="color:' + color + '">' + urduGinti[index] + '</div>';
    hint.innerText = '🔢 ' + (index + 1) + ' / 100';
    bolo(urduGinti[index], 'ur-PK');
  }

  else if (mode === 'eng-ginti') {
    card.innerHTML = '<div class="harf-bara" style="color:' + color + '">' + (index + 1) + '</div>' +
                     '<div class="lafz-bara">' + engGinti[index] + '</div>';
    hint.innerText = '🔢 ' + (index + 1) + ' / 100';
    bolo(engGinti[index], 'en-US');
  }
}

// ===================== کل تعداد =====================
function total() {
  if (mode === 'urdu-harf' || mode === 'urdu-lafz') return urduHarf.length;
  if (mode === 'abc') return abcList.length;
  return 100;
}

// ===================== اگلا پچھلا =====================
function next() {
  index = (index + 1) % total();
  dikhao();
}

function prev() {
  index = (index - 1 + total()) % total();
  dikhao();
}

// ===================== Auto =====================
function autoBand() {
  autoChalraha = false;
  document.getElementById('autoBtn').classList.remove('chalraha');
  document.getElementById('autoBtn').innerText = '🚀 Auto چلاؤ';
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
}

function autoChalao() {
  autoChalraha = true;
  document.getElementById('autoBtn').classList.add('chalraha');
  document.getElementById('autoBtn').innerText = '⏸️ Auto بند کرو';
  function step() {
    if (!autoChalraha) return;
    next();
    autoTimer = setTimeout(step, 3000);
  }
  autoTimer = setTimeout(step, 3000);
}

document.getElementById('autoBtn').onclick = function() {
  if (autoChalraha) autoBand();
  else autoChalao();
};

document.getElementById('awazBtn').onclick = function() { dikhao(); };

// ===================== مینو =====================
var menu = document.getElementById('menu');
var parda = document.getElementById('parda');
document.getElementById('menuBtn').onclick = function() {
  menu.classList.add('khula'); parda.classList.add('dikhao');
};
parda.onclick = function() {
  menu.classList.remove('khula'); parda.classList.remove('dikhao');
};

var menuItems = document.querySelectorAll('.menu-item');
menuItems.forEach(function(btn) {
  btn.onclick = function() {
    menuItems.forEach(function(b) { b.classList.remove('chuna'); });
    this.classList.add('chuna');
    mode = this.getAttribute('data-mode');
    index = 0;
    autoBand();
